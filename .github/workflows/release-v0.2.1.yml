name: Publish SkillHawk v0.2.1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release-v0.2.1]')
    runs-on: ubuntu-latest
    steps:
      - name: Create v0.2.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.2.1 already exists"
          else
            gh release create v0.2.1 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SkillHawk v0.2.1 — Node 24 compatibility" \
              --notes "Maintenance release: migrate the JavaScript Action runtime to Node 24, update GitHub workflow dependencies, keep CI coverage across Node 20/22/24, and retain the self-scan benchmark ignore fix."
          fi
