name: Community Auto Assign

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  claim:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Assign the first interested contributor
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const commenter = comment.user.login;
            const labels = (issue.labels || []).map(label => label.name);

            if (!labels.includes('micro-contribution')) return;
            if (commenter === context.repo.owner || commenter === 'github-actions[bot]') return;

            if (issue.assignees && issue.assignees.length > 0) {
              if (issue.assignees[0].login !== commenter) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Thanks @${commenter}. This task is already claimed by @${issue.assignees[0].login}. Check the other open micro-contributions for another browser-friendly task.`
                });
              }
              return;
            }

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees: [commenter]
            });

            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: comment.id,
              content: '+1'
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `Assigned to @${commenter}. Create the file described above, open the PR, and link this issue with \`Closes #${issue.number}\`. The PR guard will validate the task automatically.`
            });
