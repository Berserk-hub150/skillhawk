name: Community Metrics

on:
  schedule:
    - cron: '21 19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: community-metrics
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Snapshot public repository/community metrics
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            const { data: openMicro } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open label:"micro-contribution"`,
              per_page: 1
            });

            const { data: mergedMicro } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:pr is:merged "MC-" in:title`,
              per_page: 1
            });

            const path = 'data/community-metrics.json';
            const history = JSON.parse(fs.readFileSync(path, 'utf8'));
            history.push({
              collectedAt: new Date().toISOString(),
              stars: repo.stargazers_count,
              forks: repo.forks_count,
              openIssues: repo.open_issues_count,
              openMicroContributions: openMicro.total_count,
              mergedMicroContributions: mergedMicro.total_count
            });
            fs.writeFileSync(path, JSON.stringify(history.slice(-365), null, 2) + '\n');

      - name: Commit changed snapshot
        run: |
          if git diff --quiet data/community-metrics.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/community-metrics.json
          git commit -m "chore(metrics): update community snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
