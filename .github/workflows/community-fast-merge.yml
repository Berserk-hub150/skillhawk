name: Community Fast Merge

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  pull_request_target:
    types: [labeled]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge only validated micro-contributions after CI succeeds
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber = context.payload.pull_request?.number || null;
            let ciPassed = false;

            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              if (run.name !== 'CI' || run.conclusion !== 'success') {
                console.log(`CI did not finish successfully: ${run.conclusion}`);
                return;
              }
              ciPassed = true;

              const prs = run.pull_requests || [];
              if (prs.length > 0) {
                prNumber = prs[0].number;
              } else if (run.head_sha) {
                const { data: associated } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: run.head_sha
                });
                const open = (associated || []).find(pr => pr.state === 'open');
                if (open) prNumber = open.number;
              }
            }

            if (!prNumber) {
              console.log('No PR associated with this event.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            if (pr.state !== 'open' || pr.draft) return;

            const labels = (pr.labels || []).map(label => label.name);
            if (!labels.includes('community-fast-path')) return;

            if (!ciPassed) {
              const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: pr.head.sha,
                event: 'pull_request',
                status: 'completed',
                per_page: 100
              });
              ciPassed = (runs.workflow_runs || []).some(run => run.name === 'CI' && run.conclusion === 'success');
            }

            if (!ciPassed) {
              console.log('Validated PR is waiting for a successful CI run.');
              return;
            }

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });

            const relevant = files.filter(file => file.filename !== 'package-lock.json');
            if (
              relevant.length !== 1 ||
              !/^community\/micro-contributions\/[a-z0-9-]+\/[a-z0-9-]+\.json$/.test(relevant[0].filename)
            ) {
              console.log('PR no longer matches the safe categorized fast-path shape.');
              return;
            }

            try {
              const result = await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'squash',
                sha: pr.head.sha,
                commit_title: `${pr.title} (#${prNumber})`
              });
              console.log(`Merge result: ${result.data.merged} ${result.data.message}`);
            } catch (e) {
              console.log(`Fast merge skipped: ${e.message}`);
            }
